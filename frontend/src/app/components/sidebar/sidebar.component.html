<aside class="sidebar">
  <div class="brand">
    <span class="brand__mark">
      <svg viewBox="0 0 32 32" width="20" height="20" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="url(#g)"/>
        <defs>
          <linearGradient id="g" x1="2" y1="2" x2="30" y2="30">
            <stop offset="0" stop-color="#7C6FF0"/>
            <stop offset="0.6" stop-color="#4FD1C5"/>
            <stop offset="1" stop-color="#F0A6CD"/>
          </linearGradient>
        </defs>
      </svg>
    </span>
    <span class="brand__name">Live</span>
  </div>

  <p class="tagline">Assistant IA qui cherche, croise et cite ses sources en temps réel.</p>

  <button type="button" class="new-chat" (click)="newConversation.emit()">
    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
      <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    Nouvelle conversation
  </button>

  <div class="spacer"></div>

  <div class="status">
    <span class="status__row">
      <span class="status__dot" [class.is-online]="backendOnline === true" [class.is-offline]="backendOnline === false"></span>
      {{ backendOnline === true ? 'Backend connecté' : backendOnline === false ? 'Backend hors ligne' : 'Connexion…' }}
    </span>
    <span class="status__session">session · {{ shortSession }}</span>
  </div>
</aside>
