<div class="shell">

  <!-- Bouton menu, visible uniquement sur mobile -->
  <button type="button" class="mobile-menu-toggle" (click)="sidebarOpen = true" aria-label="Ouvrir le menu">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>

  <!-- Fond assombri derrière le tiroir, sur mobile uniquement -->
  <div class="sidebar-backdrop" *ngIf="sidebarOpen" (click)="sidebarOpen = false"></div>

  <div class="sidebar-shell" [class.is-open]="sidebarOpen">
    <app-sidebar
      [sessionId]="sessionId"
      [activeSessionId]="sessionId"
      [backendOnline]="backendOnline"
      [refreshTrigger]="historyVersion"
      (newConversation)="newConversation(); sidebarOpen = false"
      (selectConversation)="loadConversation($event); sidebarOpen = false"
      (conversationDeleted)="onConversationDeleted($event)"
    ></app-sidebar>
  </div>

  <main class="main">

    <!-- État vide : hero avec l'orbe -->
    <section class="hero" *ngIf="messages.length === 0">
      <app-orb size="hero" status="idle"></app-orb>
      <h1 class="hero__title">Bonjour. <span>Que veux-tu vérifier aujourd'hui ?</span></h1>
      <p class="hero__subtitle">Je cherche sur le web, je croise les sources, et je vous dis quand je ne suis pas sûr.</p>

      <div class="hero__input">
        <app-chat-input [disabled]="isStreaming" [showSuggestions]="true" (send)="onSend($event)"></app-chat-input>
      </div>
    </section>

    <!-- Fil de conversation -->
    <ng-container *ngIf="messages.length > 0">
      <div class="thread" #scrollArea>
        <div class="thread__inner">
          <app-message-bubble *ngFor="let m of messages" [message]="m"></app-message-bubble>
        </div>
      </div>

      <div class="dock">
        <app-chat-input [disabled]="isStreaming" [showSuggestions]="false" (send)="onSend($event)"></app-chat-input>
      </div>
    </ng-container>

  </main>
</div>
