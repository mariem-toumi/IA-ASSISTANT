<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Live — Assistant IA vérifié</title>
  <meta name="description" content="Assistant IA qui cherche en direct sur le web et vérifie ses réponses avec des sources croisées." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="ambient" aria-hidden="true">
    <span class="ambient-blob blob-1"></span>
    <span class="ambient-blob blob-2"></span>
    <span class="ambient-blob blob-3"></span>
  </div>

  <div class="app">

    <header class="topbar">
      <div class="brand">
        <div class="orb orb-mini" id="brandOrb"></div>
        <div class="brand-text">
          <strong>Live</strong>
          <span class="tagline">Assistant IA vérifié</span>
        </div>
      </div>

      <div class="topbar-actions">
        <button class="status-pill" id="statusPill" type="button" title="État de la connexion au serveur">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusLabel">Connexion…</span>
        </button>
        <button class="icon-btn" id="resetBtn" type="button" title="Nouvelle conversation" aria-label="Nouvelle conversation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
      </div>
    </header>

    <main class="stage" id="stage">

      <section class="hero" id="hero">
        <div class="orb-wrap" data-state="idle">
          <span class="scan-ring"></span>
          <div class="orb orb-hero" id="orb"></div>
        </div>

        <h1>Bonjour, <span class="accent">Mariouma</span></h1>
        <p class="hero-sub">Pose une question. Je cherche en direct sur le web et j’indique mes sources et mon niveau de confiance.</p>

        <div class="chips" id="chips">
          <button class="chip" type="button" data-q="Quelles sont les actualités IA les plus importantes aujourd'hui ?">
            <span class="chip-dot"></span>Actu IA du jour
          </button>
          <button class="chip" type="button" data-q="Quel temps fait-il a Monastir en ce moment ?">
            <span class="chip-dot"></span>Météo en direct
          </button>
          <button class="chip" type="button" data-q="Quel est le taux de change actuel entre le dinar tunisien et l'euro ?">
            <span class="chip-dot"></span>Taux de change
          </button>
          <button class="chip" type="button" data-q="Verifie ce fait : la Tour Eiffel mesure 330 metres de hauteur.">
            <span class="chip-dot"></span>Vérifier un fait
          </button>
        </div>
      </section>

      <section class="chat" id="chat" hidden aria-live="polite"></section>

    </main>

    <footer class="composer">
      <form class="composer-form" id="composerForm">
        <span class="composer-hint" id="composerHint" hidden></span>
        <input
          id="messageInput"
          type="text"
          placeholder="Écris ta question…"
          autocomplete="off"
          maxlength="1000"
        />
        <button type="submit" class="send-btn" id="sendBtn" aria-label="Envoyer le message">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
        </button>
      </form>
      <p class="composer-footnote">Live peut chercher sur le web et se tromper — vérifie les sources citées.</p>
    </footer>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
